[features]
inspector = ["gpui-kit/inspector"]

[dependencies]
anyhow.workspace = true
bytemuck = { version = "1", features = ["derive"] }
env_logger.workspace = true
gpui = { workspace = true, features = ["image-default-formats"] }
gpui_ce_elements = { path = "../crates/gpui_elements" }
gpui_ce_wgpu = { path = "../crates/gpui_wgpu", version = "0.4.0" }
gpui_fonts = { path = "../crates/gpui_ce_fonts", version = "0.4.0", package = "gpui-ce-fonts" }
gpui_platform = { workspace = true, features = ["font-kit"] }
log.workspace = true
palette.workspace = true
rand.workspace = true
smallvec.workspace = true
wgpu.workspace = true
gpui-component-story = { path = "../crates/gpui_story" }
gpui-kit = { workspace = true, features = ["tree-sitter-languages"] }
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true

autocorrect = "2.14.2"
color-lsp = "0.2.0"
jiff = "1.0"
regex = "1"
tree-sitter-navi = "0.2.3"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { version = "0.3", features = ["console"] }

[lints]
workspace = true
