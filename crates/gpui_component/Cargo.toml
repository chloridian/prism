[package]
description = "GPUI Component: the styled component library of GPUI Kit, with 60+ desktop UI components for GPUI."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
license = "Apache-2.0"
name = "gpui-component"
documentation = "https://docs.rs/gpui-component"
homepage = "https://gpui-kit.com"
repository = "https://github.com/longbridge/gpui-kit"
readme = "../../README.md"
version = "0.10.0"
publish = true
edition.workspace = true

[lib]
doctest = false

[features]
test-support = ["gpui/test-support", "gpui-base/test-support"]
inspector = ["gpui_macros/inspector", "gpui/inspector", "gpui-base/inspector"]
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-json"]

# For syntax highlighting in Markdown and CodeEditor.
tree-sitter-languages = [
    "tree-sitter-html",
    "tree-sitter-lua",
    "tree-sitter-markdown",
    "tree-sitter-toml",
    "tree-sitter-yaml",
]
tree-sitter-html = ["tree-sitter", "dep:tree-sitter-html"]
tree-sitter-lua = ["tree-sitter", "dep:tree-sitter-lua"]
tree-sitter-markdown = ["tree-sitter", "dep:tree-sitter-md"]
tree-sitter-markdown-inline = ["tree-sitter-markdown"]
tree-sitter-toml = ["tree-sitter", "dep:tree-sitter-toml-ng"]
tree-sitter-yaml = ["tree-sitter", "dep:tree-sitter-yaml"]

[dependencies]
unicode-width = "0.2"
unicode-segmentation = "1"
regex = "1"
anyhow.workspace = true
gpui = { workspace = true }
gpui_macros.workspace = true
gpui-base.workspace = true
gpui-component-macros = { workspace = true }
gpui-kit-assets = { workspace = true }
ropey.workspace = true
rust-i18n.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
sum_tree.workspace = true
tracing.workspace = true
log.workspace = true
markdown = { version = "1.0.0", features = ["serde"] }


# Calendar
jiff = "1.0"

# Code Editor
lsp-types.workspace = true
web-time = "1"

# Native-only dependencies (not available on WASM)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol.workspace = true
tree-sitter = { version = "0.26.13", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-lua = { version = "0.4.1", optional = true }
tree-sitter-md = { version = "0.5.1", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }
tree-sitter-yaml = { version = "0.7.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "=21.0.0"
# Native menu (NativeMenu) — drives AppKit NSMenu via objc2.
raw-window-handle = { workspace = true }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSMenu",
    "NSMenuItem",
    "NSView",
    "NSWindow",
    "NSResponder",
    "NSEvent",
    "NSImage",
] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSGeometry"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Native menu (NativeMenu) — drives Win32 popup menus.
raw-window-handle = { workspace = true }
resvg = "0.45.1"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
indoc = "2"

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["gpui_macros"]
